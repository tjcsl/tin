{% extends "base.html" %}
{% load static %}

{% block head %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block main %}

  <div class="login-box">
    <form method="post" action="{% url 'social:begin' 'ion' %}{% if request.GET.next %}?next={{ request.GET.next | urlencode }}{% endif %}"
      style="all: unset">
      {% csrf_token %}
      <button type="submit" style="all: unset"><a class="btn-ion">Log in with Ion</a></button>
    </form>
    {% if debug %}
      <br/>
      <a href="
        {% url 'auth:password_login' %}{% if request.GET.next %}?next={{ request.GET.next | urlencode }}{% endif %}"
         class="btn-ion">Password login</a>
    {% endif %}
  </div>

{% endblock %}
